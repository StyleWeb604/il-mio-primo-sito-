<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Il mio primo sito Cloud</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: white;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
        }
        h1 { color: #0070f3; }
        p { font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🚀 Ciao World!</h1>
        <p>Questo è il mio primo sito creato sul PC e pubblicato nel Cloud senza WordPress!</p>
    </div>
</body>
</html>
